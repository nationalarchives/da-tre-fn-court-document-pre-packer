on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  ecr-deploy:
    uses: nationalarchives/da-tre-github-actions/.github/workflows/docker-build-and-ecr-deploy-with-wiz-scan.yml@a38a32afdc8163c1ab6683d913ee97e7522dc9e0 # v0.0.88


    with:
      docker_image_name: 'da-tre-fn-court-document-pre-packer'
      build_dir: '.'
      ecr_registry_path: 'tre-v2'
    secrets:
      AWS_OPEN_ID_CONNECT_ROLE_ARN: ${{ secrets.AWS_OPEN_ID_CONNECT_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_PROJECT_TRE: ${{ secrets.WIZ_PROJECT_TRE }}
